name: Import Tally PER partial submissions

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  import-partials:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call GP Finances partial importer
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.PER_TALLY_PARTIALS_SECRET }}" \
            "https://gp-finances.fr/api/tally/per-partials/run?limit=100"
